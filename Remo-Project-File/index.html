<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remo Project File - D6 Media Studio</title>
    <!-- Playful Google Font for Remo Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Fredoka', sans-serif; 
            /* Sky Blue Background matching the poster */
            background: #2cb5e8; 
            /* Adding a subtle gradient for depth */
            background: linear-gradient(135deg, #4bd1fe 0%, #17a0d4 100%);
            color: #333; 
            text-align: center; 
            padding: 10% 20px; 
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
        }
        .box { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 20px; 
            display: inline-block; 
            /* Yellow shadow glow */
            box-shadow: 0 10px 25px rgba(255, 235, 59, 0.5); 
            max-width: 350px;
            width: 100%;
        }
        h2 { 
            /* Pink color matching the Remo Title */
            color: #e91e63; 
            font-size: 32px;
            margin-bottom: 5px; 
            margin-top: 0;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(233, 30, 99, 0.1);
        }
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        input { 
            display: block; 
            width: 90%; 
            margin: 15px auto; 
            padding: 14px; 
            border-radius: 10px; 
            border: 2px solid #eee; 
            font-size: 16px; 
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            border-color: #2cb5e8;
            outline: none;
        }
        button { 
            /* Yellow Button matching the car/text in poster */
            background: #ffeb3b; 
            color: #e91e63; 
            font-weight: 700; 
            padding: 15px 20px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 18px; 
            width: 98%; 
            margin-top: 15px;
            font-family: 'Fredoka', sans-serif;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 235, 59, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            background: #ffe000;
        }
        button:disabled { 
            background: #ccc; 
            color: #888;
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>REMO</h2>
        <p>Enter details to get the Project File!</p>
        
        <input type="text" id="userName" placeholder="Your Name" required>
        <input type="tel" id="userMobile" placeholder="Mobile Number" maxlength="10" required>
        
        <button onclick="submitForm()" id="submitBtn">Download Now 💘</button>
    </div>

    <script>
        function submitForm() {
            let name = document.getElementById('userName').value;
            let mobile = document.getElementById('userMobile').value;
            let btn = document.getElementById('submitBtn');

            // Simple validation
            if(name === "" || mobile.length < 10) {
                alert("Please enter your Name and a valid 10-digit Mobile Number.");
                return;
            }

            btn.innerText = "Loading...";
            btn.disabled = true;

            // 1. Inga unga Google Apps Script (Web App) URL-ah podunga
            const webhookUrl = "https://script.google.com/macros/s/AKfycbw2PzGWIVJjFt6uANsUqK5rs2tHfdVUqNTHXPlyoN3IRzsVs26H7D9mcXScTGdeBfcr/exec"; 

            // 2. Inga unga Remo Project-oda Google Drive Link-ah podunga
            const driveLink = "https://drive.google.com/drive/u/0/folders/1fHSm42d84diMtdW2UdKSGz1I6VStTYDq?utm_referrer=sp_auto_dm";

            let data = {
                "name": name,
                "mobile": mobile
            };

            fetch(webhookUrl, {
                method: 'POST',
                body: JSON.stringify(data),
            })
            .then(response => {
                // Data save aanathum Drive link-ku redirect aagum
                window.location.href = driveLink;
            })
            .catch(error => {
                console.error('Error!', error.message);
                // Error vanthalum Drive link-ku poidum
                window.location.href = driveLink;
            });
        }
    </script>
</body>
</html>
