<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizhi Veekura Project File - D6 Media Studio</title>
    <!-- Cinzel Font Import -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cinzel', serif; /* Cinzel Font applied */
            background: #111; 
            color: #fff; 
            text-align: center; 
            padding: 10% 20px; 
        }
        .box { 
            background: #222; 
            padding: 30px; 
            border-radius: 10px; 
            display: inline-block; 
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); 
            max-width: 350px;
            width: 100%;
        }
        h2 { color: #ffcc00; margin-bottom: 5px; letter-spacing: 2px; }
        input { 
            display: block; 
            width: 90%; 
            margin: 15px auto; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            font-size: 16px; 
            text-align: center;
            background: #333;
            color: #fff;
        }
        button { 
            background: #ffcc00; 
            color: #000; 
            font-weight: bold; 
            padding: 14px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 98%; 
            margin-top: 10px;
            font-family: 'Cinzel', serif;
        }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Vizhi Veekura Project File</h2>
        <p>Enter your details to view the project</p>
        
        <input type="text" id="userName" placeholder="Name" required>
        <input type="tel" id="userMobile" placeholder="Mobile Number" maxlength="10" required>
        
        <button onclick="submitForm()" id="submitBtn">View Project Now</button>
    </div>

    <script>
        function submitForm() {
            let name = document.getElementById('userName').value;
            let mobile = document.getElementById('userMobile').value;
            let btn = document.getElementById('submitBtn');

            if(name === "" || mobile.length < 10) {
                alert("Please enter your Name and a 10-digit Mobile Number.");
                return;
            }

            btn.innerText = "Loading...";
            btn.disabled = true;

            const webhookUrl = "https://script.google.com/macros/s/AKfycbydmz3P2N2BKgxxwl8IKZN6tB_NGjdRqySviMZCmvlSRpoKqXoTaEGla99gF1BFYymp/exec"; // Inga unga Google Apps Script link irukkanum

         let data = { "name": name, "mobile": mobile };

            fetch(webhookUrl, {
                method: 'POST',
                body: JSON.stringify(data),
            })
            .then(response => {
                // Form submit aanathum unga main page-ku redirect aagum!
                window.location.href = "main_project.html";
            })
            .catch(error => {
                // Sila neram network slow-a irunthalum main page-ku poidum
                window.location.href = "main_project.html";
            });
        }
    </script>
</body>
</html>
