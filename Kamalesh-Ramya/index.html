<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamalesh & Ramya | D6 Media Studio</title>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            /* Romantic background gradient - you can replace this with a blurred couple photo */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }

        .welcome-text {
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .couple-names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #d6336c; /* Elegant pinkish-red */
            margin: 0;
            line-height: 1.2;
        }

        .sub-text {
            font-size: 0.85rem;
            color: #555;
            margin: 20px 0 30px;
            line-height: 1.5;
        }

        /* Cute Animated Button */
        .gallery-btn {
            display: inline-block;
            background-color: #d6336c;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s infinite;
        }

        .gallery-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(214, 51, 108, 0.5);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer b {
            color: #333;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="welcome-text">A Glimpse of Forever</div>
        
        <!-- Couple Names -->
        <h1 class="couple-names">Kamalesh <br>&<br> Ramya</h1>
        
        <p class="sub-text">Your beautiful moments have been carefully curated. Click below to relive your special day.</p>
        
        <!-- REPLACE THE LINK HERE -->
        <a href="YOUR_GOOGLE_DRIVE_LINK_HERE" class="gallery-btn">View Gallery 🤍</a>
        
        <div class="footer">
            Captured with love by <br><b>D6 Media Studio</b>
        </div>
    </div>

</body>
</html>
